# Response security headers for the Precision ERP site.
#
# In a file because nginx does not merge add_header across levels: a location
# that sets any add_header of its own discards every one inherited from the
# server block. `location = /index.html` sets Cache-Control, so the headers
# declared once at server level never reached the only document that needs a
# Content-Security-Policy. Including this in each such location is the fix.
#
# The app keeps its session JWT in localStorage, so a single injected script
# is a stolen session; permitting scripts only from this origin is what makes
# that hard. Google Fonts and React's inline element styles are named because
# the application genuinely uses them.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
