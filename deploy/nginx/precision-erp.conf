# Precision Auto Components ERP — separate site, port 8083 (8082 is the LAB Automotive website)
server {
    listen 8083;
    listen [::]:8083;
    server_name _;

    root /srv/www/precision-erp/client/dist;
    index index.html;

    include snippets/erp-security-headers.conf;

    client_max_body_size 25m;

    # Compression (nginx.conf enables gzip but leaves gzip_types default = text/html only)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/javascript text/xml application/xml
               image/svg+xml application/manifest+json;

    location /api/ {
        proxy_pass http://127.0.0.1:5060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # Hashed filenames — safe to cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/erp-security-headers.conf;
    }

    # index.html must never be cached, or deploys are invisible to returning users
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        include snippets/erp-security-headers.conf;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
