services:
  - type: web
    name: precision-erp
    runtime: node
    plan: free
    region: oregon
    buildCommand: rm -f package-lock.json && npm install --include=dev --include=optional && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
